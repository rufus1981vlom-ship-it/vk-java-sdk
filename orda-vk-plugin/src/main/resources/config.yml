vk-account:
  # user access token аккаунта VK, который публикует посты
  token: ""
  api-version: "5.199"
  max-message-length: 3900

auto-promo:
  enabled: true
  interval-minutes: 20
  daily-limit: 24
  min-post-length: 40
  max-post-length: 650
  max-targets: 200

  server-site: "https://orda.example"
  server-ip: "play.ordaproject.net"

auto-pr:
  auto-enable: true
  server-ip: "play.ordaproject.net"
  cta: "Залетай на сервер сегодня и зови друзей!"
  text-style: "живой, игровой, без канцелярита"
  daily-limit: 6
  min-post-length: 60
  max-post-length: 700
  event-cooldown-minutes: 90

  smm-group:
    enabled: true
    period-hours: 8

  schedule:
    morning: "09:00"
    evening: "19:00"
    weekly-day: "SUNDAY"
    event-driven: true

  event-thresholds:
    pvp-kills: 6
    deaths: 15

  rubrics-enabled:
    - "новости"
    - "анонсы"
    - "мемы"
    - "гайды"
    - "итоги недели"
    - "живые посты по событиям"

  sources:
    events: "Сегодня активен PvP-ивент с наградами"
    changelog: "Улучшена стабильность сервера и оптимизирован спавн"
    map: "Добавлены новые точки интереса около спавна"

  openai:
    api-key: "" # лучше задавать через env OPENAI_API_KEY
    responses-model: "gpt-5-mini"
    images-model: "gpt-image-1"

  image-generation:
    enabled: true
  image-size: "1024x1024"

  vk:
    smm-group-owner-id: -1
    group-link: "https://vk.com/your_group"
