name: PiarOrda
version: ${version}
main: com.orda.vkplugin.PiarOrdaPlugin
api-version: '1.20'
author: Orda
description: AI promo campaign sender for VK groups.
commands:
  piaro:
    description: Manage PiarOrda campaign scheduler
    usage: /piaro <start|stop|reload>
    permission: piaro.admin
permissions:
  piaro.admin:
    description: Access to PiarOrda control command
    default: op
